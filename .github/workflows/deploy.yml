name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button

concurrency:
  group: deploy
  cancel-in-progress: true  # avoids two deploys overlapping

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # env:
        #   VITE_API_URL: ${{ secrets.VITE_API_URL }}   # build-time variables go here

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./build/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/mysite/